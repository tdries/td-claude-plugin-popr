<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210" width="720" height="210" role="img" aria-label="Three POPR banners stacked: a finished session, one waiting on a permission, and one that hit an API error. Each is an ivory pill carrying that project's own confetti mark, the project and branch, and a short status.">
<style>.n{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-size:19px;fill:#6B6862}</style>
<defs>
  <g id="pill"><rect x="0" y="0" width="720" height="56" rx="28" fill="#F0EEE6" stroke="#191919" stroke-opacity="0.10"/></g>
</defs>

<use href="#pill" y="0"/>
<g transform="translate(26,14)" shape-rendering="crispEdges">
  <rect x="2"  y="3"  width="8" height="8"  fill="#D97757"/><rect x="14" y="0"  width="9" height="9"  fill="#6A9BCC"/>
  <rect x="22" y="12" width="8" height="8"  fill="#CC785C"/><rect x="0"  y="16" width="9" height="9"  fill="#BCD1CA"/>
  <rect x="12" y="18" width="8" height="8"  fill="#BF9C88"/><rect x="24" y="24" width="7" height="7"  fill="#CBCADB"/>
</g>
<text class="n" x="82" y="35">✓ acme-widgets · main    Deployed the release to staging</text>

<use href="#pill" y="77"/>
<g transform="translate(26,91)" shape-rendering="crispEdges">
  <rect x="0"  y="0"  width="9" height="9"  fill="#CC785C"/><rect x="16" y="5"  width="8" height="8"  fill="#BCD1CA"/>
  <rect x="6"  y="14" width="8" height="8"  fill="#6A9BCC"/><rect x="24" y="16" width="7" height="7"  fill="#D97757"/>
  <rect x="14" y="23" width="9" height="9"  fill="#CBCADB"/><rect x="0"  y="24" width="7" height="7"  fill="#BF9C88"/>
</g>
<text class="n" x="82" y="112">⋯ kikl-cockpit · feature/sdm    Waiting on permission to push</text>

<use href="#pill" y="154"/>
<g transform="translate(26,168)" shape-rendering="crispEdges">
  <rect x="10" y="0"  width="8" height="8"  fill="#BF9C88"/><rect x="24" y="4"  width="8" height="8"  fill="#D97757"/>
  <rect x="0"  y="8"  width="9" height="9"  fill="#CBCADB"/><rect x="14" y="14" width="9" height="9"  fill="#CC785C"/>
  <rect x="26" y="20" width="7" height="7"  fill="#BCD1CA"/><rect x="4"  y="23" width="8" height="8"  fill="#6A9BCC"/>
</g>
<text class="n" x="82" y="189">✕ popr · main    Rate limit error from the API</text>
</svg>
